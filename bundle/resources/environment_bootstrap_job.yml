resources:
  jobs:
    frontrunner_environment_bootstrap:
      name: frontrunner-environment-bootstrap

      tags:
        environment: ${bundle.target}

      tasks:
        - task_key: environment_setup
          notebook_task:
            notebook_path: ../../setup/setup_environment.ipynb
            base_parameters:
              catalog: ${var.frontrunner_catalog}

        - task_key: run_ingestion
          depends_on:
            - task_key: environment_setup
          pipeline_task:
            pipeline_id: ${resources.pipelines.frontrunner_ingestion_pipeline.id}

        - task_key: run_transformation
          depends_on:
            - task_key: run_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.frontrunner_transformation_pipeline.id}

        - task_key: event_log_setup
          depends_on:
            - task_key: run_transformation
          notebook_task:
            notebook_path: ../../setup/setup_event_log.ipynb
            base_parameters:
              catalog: ${var.frontrunner_catalog}
              ingestion_pipeline_id: ${resources.pipelines.frontrunner_ingestion_pipeline.id}
              transformation_pipeline_id: ${resources.pipelines.frontrunner_transformation_pipeline.id}

        - task_key: dq_dashboard_setup
          depends_on:
            - task_key: event_log_setup
          notebook_task:
            notebook_path: ../../monitoring/dq_dashboard_setup.ipynb
            base_parameters:
              catalog: ${var.frontrunner_catalog}
              schema: frontrunner

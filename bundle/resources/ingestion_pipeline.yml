resources:
  pipelines:
    frontrunner_ingestion_pipeline:
      name: frontrunner-ingestion-pipeline
      serverless: true
      allow_duplicate_names: true
      tags:
        environment: ${bundle.target}
 
      root_path: ${workspace.file_path}/pipelines/ingestion_pipeline
 
      catalog: ${var.frontrunner_catalog}
      schema: frontrunner
 
      configuration:
        frontrunner.catalog: ${var.frontrunner_catalog}
 
      libraries:
        - glob:
            include: ../../pipelines/ingestion_pipeline/transformations/**